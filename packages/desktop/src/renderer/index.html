<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: http://localhost:* https://*; connect-src 'self' http://localhost:* http://127.0.0.1:* https://*;" />
    <title>CYP-memo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow-x: hidden;
        overflow-y: auto;
        background-color: #f5f7fa;
      }
      body[data-theme='dark'] {
        background-color: #1d1e1f;
      }
      /* 初始加载动画 */
      .app-initial-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #ffffff;
        /* 与 theme.css --cyp-font-sans 同口径（首屏 CSS 变量尚未注入） */
        font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', '微软雅黑', 'Noto Sans SC',
          'Source Han Sans SC', system-ui, sans-serif;
      }
      .app-initial-loading__logo {
        font-size: 64px;
        margin-bottom: 24px;
        animation: bounce 2s ease-in-out infinite;
      }
      .app-initial-loading__text {
        font-size: 18px;
        opacity: 0.9;
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 初始加载状态 -->
      <div class="app-initial-loading">
        <div class="app-initial-loading__logo">CYP</div>
        <div class="app-initial-loading__text">正在加载 CYP-memo...</div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
