# CYP-memo 本地可观测告警规则
# 落实规范 2.14（监控告警可观测性）与 R14（page/ticket/logging 三级，禁止全量邮件式告警）。
# 指标为本项目真实 instrument 名（见 docs/slo/README.md）：
#   start_local_duration_seconds / verify_e2e_total / hot_reload_count /
#   gate_token_total / devloop_duration_ms / process_* / node_* / container_*。
# 每条规则必须含 annotations.runbook_url（规范 2.14-3 硬要求）。
# 分级通过 labels.tier 表达：page=立即呼叫 / ticket=建单跟进 / logging=仅记录。

groups:
  - name: cyp-memo-local-start
    rules:
      - alert: StartColdSlow
        expr: start_local_duration_seconds > 120
        for: 5m
        labels:
          tier: page
          severity: critical
        annotations:
          summary: "冷启动超过 120s（SLO-START 违规）"
          description: "start_local_duration_seconds={{ $value }}s，超过 P95≤120s 目标。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/runbooks/start-cold-slow.md"

      - alert: StartLocalAbsent
        expr: absent(start_local_duration_seconds)
        for: 1h
        labels:
          tier: logging
          severity: info
        annotations:
          summary: "长时间无本地启动探测"
          description: "过去 1h 未采集到 start_local_duration_seconds，可能未启动或采集断链。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/runbooks/start-absent.md"

  - name: cyp-memo-local-verify
    rules:
      - alert: VerifyE2EFailureRateHigh
        expr: |
          rate(verify_e2e_total{result="fail"}[10m])
          / clamp_min(rate(verify_e2e_total[10m]), 1e-9) > 0.10
        for: 10m
        labels:
          tier: ticket
          severity: warning
        annotations:
          summary: "verify-e2e 失败率 > 10%（SLO-VERIFY 风险）"
          description: "近 10m 失败率={{ $value | humanizePercentage }}，目标成功率≥90%。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/runbooks/verify-e2e-failure.md"

      - alert: VerifyE2ENoRun
        expr: absent(verify_e2e_total)
        for: 1h
        labels:
          tier: logging
          severity: info
        annotations:
          summary: "近 1h 未执行 verify-e2e"
          description: "未采集到 verify_e2e_total，可能遗漏 e2e 验证。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/runbooks/verify-e2e-no-run.md"

  - name: cyp-memo-local-devloop
    rules:
      - alert: HotReloadFailureRateHigh
        expr: |
          rate(hot_reload_count{result="fail"}[10m])
          / clamp_min(rate(hot_reload_count[10m]), 1e-9) > 0.05
        for: 10m
        labels:
          tier: ticket
          severity: warning
        annotations:
          summary: "hot reload 失败率 > 5%（SLO-HOTRELOAD 风险）"
          description: "近 10m 失败率={{ $value | humanizePercentage }}，目标≤5%。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/runbooks/hot-reload-failure.md"

      - alert: DevloopOverBudget
        expr: devloop_duration_ms > 300000
        for: 10m
        labels:
          tier: logging
          severity: info
        annotations:
          summary: "开发闭环单轮 > 5min（SLO-DEVLOOP）"
          description: "devloop_duration_ms={{ $value }}ms，超过 P95≤5min 目标。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/runbooks/devloop-over-budget.md"

  - name: cyp-memo-local-gate
    rules:
      - alert: GateTokenMissing
        expr: increase(gate_token_total{missing="true"}[1h]) > 0
        for: 0m
        labels:
          tier: page
          severity: critical
        annotations:
          summary: "检测到 scripts/ 改动缺 gate_token（SLO-GATE 违规）"
          description: "近 1h gate_token_total{missing=true} 增量={{ $value }}，缺失率须为 0。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/runbooks/gate-token-missing.md"

      - alert: GateAuditStale
        expr: absent(gate_token_total)
        for: 24h
        labels:
          tier: ticket
          severity: warning
        annotations:
          summary: "24h 无 gate_token 签发记录"
          description: "活跃开发期长时间无门禁签发，可能绕过 scripts/ 授权签发面。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/runbooks/gate-audit-stale.md"

  - name: cyp-memo-local-resources
    rules:
      - alert: DiskUsageHigh
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
               / node_filesystem_size_bytes) > 0.80
        for: 10m
        labels:
          tier: ticket
          severity: warning
        annotations:
          summary: "磁盘使用率 > 80%"
          description: "挂载点 {{ $labels.mountpoint }} 使用率={{ $value | humanizePercentage }}。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/runbooks/disk-high.md"

      - alert: MemoryUsageHigh
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 5m
        labels:
          tier: page
          severity: critical
        annotations:
          summary: "内存使用率 > 90%"
          description: "节点内存使用率={{ $value | humanizePercentage }}，逼近 OOM。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/runbooks/memory-high.md"

      - alert: MemoryBudgetExceeded
        expr: process_resident_memory_bytes{job="cyp-memo"} > 1073741824
        for: 10m
        labels:
          tier: ticket
          severity: warning
        annotations:
          summary: "进程常驻内存超预算（>1GiB）"
          description: "cyp-memo 进程 RSS={{ $value | humanize1024 }}B，超出资源预算。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/runbooks/memory-budget.md"

      - alert: CpuUsageHigh
        expr: rate(process_cpu_seconds_total{job="cyp-memo"}[5m]) * 100 > 90
        for: 10m
        labels:
          tier: logging
          severity: info
        annotations:
          summary: "单进程 CPU 使用率 > 90%"
          description: "cyp-memo 近 5m 平均 CPU={{ $value | humanizePercentage }}。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/runbooks/cpu-high.md"

  - name: cyp-memo-local-bypass
    rules:
      - alert: McpBypassDown
        expr: up{job="cyp-mcp-bypass"} == 0
        for: 2m
        labels:
          tier: page
          severity: critical
        annotations:
          summary: "MCP 旁路进程（环回 :13175）下线"
          description: "MCP 旁路 up={{ $value }}，产品入口 /mcp 反代将失败。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/runbooks/mcp-bypass-down.md"

  - name: cyp-memo-auto-rollback
    # 自动回滚联动告警规则（与 docs/auto-rollback-policy.md 策略对齐）
    # labels.rollback_tier 标注对应回滚级别：L1=告警 / L2=软回滚 / L3=硬回滚
    # 指标口径：5 分钟滑动窗口，与 auto-rollback 脚本判定逻辑一致
    rules:
      # ---- C1: API 错误率 ----
      - alert: ApiErrorRateHigh-L1
        expr: |
          rate(http_requests_total{job="cyp-memo", code=~"5.."}[5m])
          / clamp_min(rate(http_requests_total{job="cyp-memo"}[5m]), 1e-9) > 0.05
        for: 5m
        labels:
          tier: ticket
          severity: warning
          rollback_tier: L1
        annotations:
          summary: "API 错误率 > 5%（L1 告警）"
          description: "近 5m 5xx 错误率={{ $value | humanizePercentage }}，达到 L1 告警阈值。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/auto-rollback-policy.md"

      - alert: ApiErrorRateHigh-L2
        expr: |
          rate(http_requests_total{job="cyp-memo", code=~"5.."}[5m])
          / clamp_min(rate(http_requests_total{job="cyp-memo"}[5m]), 1e-9) > 0.10
        for: 5m
        labels:
          tier: page
          severity: critical
          rollback_tier: L2
        annotations:
          summary: "API 错误率 > 10%（L2 软回滚）"
          description: "近 5m 5xx 错误率={{ $value | humanizePercentage }}，达到 L2 软回滚阈值（服务重启）。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/auto-rollback-policy.md"

      - alert: ApiErrorRateHigh-L3
        expr: |
          rate(http_requests_total{job="cyp-memo", code=~"5.."}[5m])
          / clamp_min(rate(http_requests_total{job="cyp-memo"}[5m]), 1e-9) > 0.20
        for: 5m
        labels:
          tier: page
          severity: critical
          rollback_tier: L3
        annotations:
          summary: "API 错误率 > 20%（L3 硬回滚）"
          description: "近 5m 5xx 错误率={{ $value | humanizePercentage }}，达到 L3 硬回滚阈值（快照回滚 + 重启）。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/auto-rollback-policy.md"

      # ---- C2: P95 响应时间 ----
      - alert: ApiLatencyP95High-L1
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{job="cyp-memo"}[5m])
          ) > 3
        for: 5m
        labels:
          tier: ticket
          severity: warning
          rollback_tier: L1
        annotations:
          summary: "API P95 响应时间 > 3s（L1 告警）"
          description: "近 5m P95 延迟={{ $value }}s，超过 3s 阈值。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/auto-rollback-policy.md"

      - alert: ApiLatencyP95High-L2
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{job="cyp-memo"}[5m])
          ) > 5
        for: 5m
        labels:
          tier: page
          severity: critical
          rollback_tier: L2
        annotations:
          summary: "API P95 响应时间 > 5s（L2 软回滚）"
          description: "近 5m P95 延迟={{ $value }}s，达到 L2 软回滚阈值（服务重启）。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/auto-rollback-policy.md"

      - alert: ApiLatencyP95High-L3
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{job="cyp-memo"}[5m])
          ) > 10
        for: 5m
        labels:
          tier: page
          severity: critical
          rollback_tier: L3
        annotations:
          summary: "API P95 响应时间 > 10s（L3 硬回滚）"
          description: "近 5m P95 延迟={{ $value }}s，达到 L3 硬回滚阈值（快照回滚 + 重启）。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/auto-rollback-policy.md"

      # ---- C3: 可用性 ----
      - alert: AvailabilityLow-L1
        expr: |
          rate(http_requests_total{job="cyp-memo", code=~"2.."}[5m])
          / clamp_min(rate(http_requests_total{job="cyp-memo"}[5m]), 1e-9) < 0.99
        for: 5m
        labels:
          tier: ticket
          severity: warning
          rollback_tier: L1
        annotations:
          summary: "API 可用性 < 99%（L1 告警）"
          description: "近 5m 可用性={{ $value | humanizePercentage }}，低于 99% 目标。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/auto-rollback-policy.md"

      - alert: AvailabilityLow-L2
        expr: |
          rate(http_requests_total{job="cyp-memo", code=~"2.."}[5m])
          / clamp_min(rate(http_requests_total{job="cyp-memo"}[5m]), 1e-9) < 0.95
        for: 5m
        labels:
          tier: page
          severity: critical
          rollback_tier: L2
        annotations:
          summary: "API 可用性 < 95%（L2 软回滚）"
          description: "近 5m 可用性={{ $value | humanizePercentage }}，达到 L2 软回滚阈值。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/auto-rollback-policy.md"

      - alert: AvailabilityLow-L3
        expr: |
          rate(http_requests_total{job="cyp-memo", code=~"2.."}[5m])
          / clamp_min(rate(http_requests_total{job="cyp-memo"}[5m]), 1e-9) < 0.90
        for: 5m
        labels:
          tier: page
          severity: critical
          rollback_tier: L3
        annotations:
          summary: "API 可用性 < 90%（L3 硬回滚）"
          description: "近 5m 可用性={{ $value | humanizePercentage }}，达到 L3 硬回滚阈值（快照回滚 + 重启）。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/auto-rollback-policy.md"

      # ---- C4: 健康检查失败 ----
      - alert: HealthCheckFail-L2
        expr: |
          up{job="cyp-memo"} == 0
        for: 2m
        labels:
          tier: page
          severity: critical
          rollback_tier: L2
        annotations:
          summary: "cyp-memo 服务健康检查失败（L2 软回滚）"
          description: "cyp-memo 进程 up={{ $value }}，已连续 2m 无响应，达到 L2 软回滚阈值。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/auto-rollback-policy.md"

      # ---- C5: 内存使用率（与 cyp-memo-local-resources 组 MemoryUsageHigh 对齐，补充 rollback_tier） ----
      - alert: MemoryUsageCritical-L2
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 5m
        labels:
          tier: page
          severity: critical
          rollback_tier: L2
        annotations:
          summary: "内存使用率 > 90%（L2 软回滚）"
          description: "节点内存使用率={{ $value | humanizePercentage }}，持续 5m 超阈值，达到 L2 软回滚阈值。"
          runbook_url: "https://github.com/ADdss-hub/CYP-memo/blob/main/docs/auto-rollback-policy.md"
