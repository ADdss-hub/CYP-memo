# ============================================================
# SPIFFE 证书配置说明
# ============================================================
#
# 证书路径映射（与 KMS mTLS 模块对齐）：
#   CA 证书:    /etc/certs/ca.crt        ← {dataDir}/kms/mtls/ca.crt
#   工作负载证书: /etc/certs/workload.crt  ← {dataDir}/kms/mtls/workload.crt
#   工作负载密钥: /etc/certs/workload.key  ← {dataDir}/kms/mtls/workload.key
#
# SPIFFE ID 规划：
#   主服务:   spiffe://runtimebase.local/mgmt/biz
#   KMS:     spiffe://runtimebase.local/mgmt/kms
#   MCP:     spiffe://runtimebase.local/host/mcp
#   审计:    spiffe://runtimebase.local/host/audit
#   认证:    spiffe://runtimebase.local/mgmt/iam
#
# 注意：当前为预埋配置模板，实际部署时需根据服务网格方案调整
# ============================================================
