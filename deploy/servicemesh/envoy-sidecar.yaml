# ============================================================
# CYP-memo Envoy Sidecar 配置模板
# ------------------------------------------------------------
# 用途：未来接入 Istio / Linkerd 等服务网格时的 sidecar 参考配置
# 当前：预埋配置，单机模式下不启用
# 信任域：runtimebase.local（与 KMS SPIFFE 信任根一致）
# ============================================================

admin:
  access_log_path: /dev/stdout
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 15000

# ============================================================
# 静态资源定义
# ============================================================
static_resources:
  # ----------------------------------------------------------
  # 监听器（Listeners）
  # ----------------------------------------------------------
  listeners:
    # 入站监听器：接收南北向流量（用户侧）
    - name: ingress_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 5170  # CYP-memo 主端口
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: ingress_route
                  virtual_hosts:
                    - name: cyp_memo_service
                      domains: ["*"]
                      routes:
                        # API 路由 -> 后端 API 服务
                        - match:
                            prefix: "/api/"
                          route:
                            cluster: cyp_memo_api
                            timeout: 30s
                            retry_policy:
                              retry_on: "5xx,reset,connect-failure,refused-stream"
                              num_retries: 3
                              per_try_timeout: 10s
                              retry_back_off:
                                base_interval: 0.1s
                                max_interval: 10s
                        # MCP 代理路由
                        - match:
                            prefix: "/mcp"
                          route:
                            cluster: cyp_mcp_server
                            timeout: 300s
                        # 前端静态资源
                        - match:
                            prefix: "/"
                          route:
                            cluster: cyp_memo_api
                            timeout: 30s
                http_filters:
                  # 限流过滤器
                  - name: envoy.filters.http.ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
                      domain: cyp_memo
                      request_type: external
                      rate_limit_service:
                        grpc_service:
                          envoy_grpc:
                            cluster_name: rate_limit_service
                        timeout: 0.25s
                  # 熔断器（路由器内配置）
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # 出站监听器：East-West 服务间调用
    - name: egress_listener
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 15001
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress_http
                codec_type: AUTO
                route_config:
                  name: egress_route
                  virtual_hosts:
                    - name: kms_service
                      domains: ["kms.runtimebase.local"]
                      routes:
                        - match:
                            prefix: "/kms/"
                          route:
                            cluster: kms_service
                            timeout: 5s
                            retry_policy:
                              retry_on: "5xx,reset,connect-failure"
                              num_retries: 2
                              per_try_timeout: 2s
                    - name: mcp_service
                      domains: ["mcp.runtimebase.local"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: cyp_mcp_server
                            timeout: 300s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      # mTLS 出站配置
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_certificates:
              - certificate_chain:
                  filename: /etc/certs/workload.crt
                private_key:
                  filename: /etc/certs/workload.key
            validation_context:
              trusted_ca:
                filename: /etc/certs/ca.crt
              match_subject_alt_names:
                - exact: "spiffe://runtimebase.local/kms"
                - exact: "spiffe://runtimebase.local/mcp"
          sni: "runtimebase.local"

  # ----------------------------------------------------------
  # 集群（Clusters）- 后端服务定义
  # ----------------------------------------------------------
  clusters:
    # 主服务 API 集群
    - name: cyp_memo_api
      connect_timeout: 1s
      type: STATIC
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1000
            max_pending_requests: 1000
            max_requests: 2000
            max_retries: 50
      hosts:
        - socket_address:
            address: 127.0.0.1
            port_value: 10170  # 后端 API 服务端口

    # KMS 服务集群（mTLS）
    - name: kms_service
      connect_timeout: 0.5s
      type: STATIC
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 50
            max_pending_requests: 50
            max_requests: 100
            max_retries: 10
      hosts:
        - socket_address:
            address: 127.0.0.1
            port_value: 12000  # KMS 独立服务端口
      # mTLS 上游连接
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_certificates:
              - certificate_chain:
                  filename: /etc/certs/workload.crt
                private_key:
                  filename: /etc/certs/workload.key
            validation_context:
              trusted_ca:
                filename: /etc/certs/ca.crt
              match_subject_alt_names:
                - exact: "spiffe://runtimebase.local/kms"
          sni: "kms.runtimebase.local"

    # MCP Server 集群
    - name: cyp_mcp_server
      connect_timeout: 1s
      type: STATIC
      lb_policy: ROUND_ROBIN
      hosts:
        - socket_address:
            address: 127.0.0.1
            port_value: 10175  # MCP Server 端口

    # 限流服务（可选，外部 RLS）
    - name: rate_limit_service
      connect_timeout: 0.25s
      type: STATIC
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      hosts:
        - socket_address:
            address: 127.0.0.1
            port_value: 8081

  # ----------------------------------------------------------
  # 运行时配置（可选）
  # ----------------------------------------------------------
  # runtime:
  #   symlink_root: /srv/runtime/current
  #   subdirectory: envoy
  #   override_subdirectory: envoy_override

# ============================================================
# 集群发现服务（CDS）- 动态服务发现（未来接入 Consul/Nomad）
